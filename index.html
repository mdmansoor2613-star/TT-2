<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Tracker · B.Sc (Hons) Agri</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header>
  <div>
    <h1>HABOR-1326</h1>
    <p>B.Sc (Hons) Agri · II Year I Sem · ANGRAU, Pulivendula</p>
  </div>
  <div class="ctl">
    <button id="theme" aria-label="Toggle light or dark theme" title="Toggle light / dark">🌙</button>
  </div>
</header>
<main>
  <section>
    <h2>Total attendance
      <label class="target">Minimum <input id="target" type="number" min="1" max="99" value="75">%</label>
    </h2>
    <div class="card total" id="overall"></div>
    <div class="insights" id="insights"></div>
    <div class="subjects" id="subjects"></div>
  </section>
  <section>
    <h2>Daily <small id="dayLabel"></small></h2>
    <div class="daybar" id="daybar">
      <button data-a="prev">‹ Prev</button>
      <button data-a="today">Today</button>
      <button data-a="next">Next ›</button>
      <button data-a="all">All present</button>
      <button data-a="hol" id="hol">Mark holiday</button>
    </div>
    <div class="periods" id="periods"></div>
    <h2>Calendar</h2>
    <div class="card" id="cal"></div>
    <h2>Calculator</h2>
    <div class="card calc">
      <label>Subject <select id="cSub"></select></label>
      <label>Total classes <input id="cT" type="number" min="0" value="0"></label>
      <label>Attended classes <input id="cA" type="number" min="0" value="0"></label>
      <button id="cFill" type="button">Use my current numbers</button>
      <output id="cOut"></output>
    </div>
  </section>
</main>
<footer>MY HAI THAK KAIKU DARTIN HABIBUUUU </footer>
<script src="script.js"></script>
</body>
</html>
